[project]
name = "rag-service"
version = "1.1.2"
description = "知店智能客服：基于店铺知识库的中文智能客服"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "redis>=5.2",
    "pymilvus>=2.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "flagembedding>=1.4.2",
    "jieba>=0.42.1",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ragas>=0.4.3",
    "langchain-community>=0.3,<0.4",
]
ml = ["sentence-transformers>=3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: 需要真实 MySQL/Redis/Milvus，未启用时跳过",
]
