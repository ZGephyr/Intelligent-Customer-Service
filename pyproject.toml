[project]
name = "rag-service"
version = "0.1.0"
description = "RAG 电商智能客服 MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "redis>=5.2",
    "pymilvus>=2.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "flagembedding>=1.4.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]
ml = ["sentence-transformers>=3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: 需要真实 MySQL/Redis/Milvus，未启用时跳过",
]
